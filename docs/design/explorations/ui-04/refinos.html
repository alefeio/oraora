<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UI-04R — refinamentos antes/depois</title>
  <style>
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #fcf7ee; color: #2a2140; }
    header, section { width: min(1400px, calc(100% - 2rem)); margin: 0 auto; }
    header { padding: 1.5rem 0 0.5rem; }
    h1 { font-family: Nunito, sans-serif; color: #533e7e; font-size: 1.7rem; margin: 0; }
    p { color: #534a66; }
    h2 { font-size: 1rem; margin: 1.5rem 0 0.6rem; color: #533e7e; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; align-items: start; }
    figure { margin: 0; background: white; border: 1px solid #e4d9c8; border-radius: 0.8rem; overflow: hidden; }
    figcaption { padding: 0.55rem 0.75rem; font-size: 0.8rem; font-weight: 600; }
    img { width: 100%; height: auto; display: block; background: #fcf7ee; }
    @media (max-width: 800px) { .pair { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>UI-04R — refinamentos</h1>
    <p>À esquerda, proposta UI-04 anterior. À direita, refinamentos UI-04R. Somente protótipos isolados.</p>
  </header>
  <section>
    <h2>1. Login mobile</h2>
    <div class="pair">
      <figure><figcaption>Antes</figcaption><img src="../../evidence/ui-04/refinos/antes-login-mobile.png" alt="Login mobile antes" /></figure>
      <figure><figcaption>Depois</figcaption><img src="../../evidence/ui-04/refinos/depois-login-mobile.png" alt="Login mobile depois" /></figure>
    </div>
    <h2>2. Login desktop</h2>
    <div class="pair">
      <figure><figcaption>Antes</figcaption><img src="../../evidence/ui-04/refinos/antes-login-desktop.png" alt="Login desktop antes" /></figure>
      <figure><figcaption>Depois</figcaption><img src="../../evidence/ui-04/refinos/depois-login-desktop.png" alt="Login desktop depois" /></figure>
    </div>
    <h2>3. Pedir oração bloqueado</h2>
    <div class="pair">
      <figure><figcaption>Antes</figcaption><img src="../../evidence/ui-04/refinos/antes-pedir-bloqueado-desktop.png" alt="Pedir bloqueado antes" /></figure>
      <figure><figcaption>Depois</figcaption><img src="../../evidence/ui-04/refinos/depois-pedir-bloqueado-desktop.png" alt="Pedir bloqueado depois" /></figure>
    </div>
    <h2>4. Encontrar pedidos — mobile</h2>
    <div class="pair">
      <figure><figcaption>Antes</figcaption><img src="../../evidence/ui-04/refinos/antes-encontrar-mobile.png" alt="Encontrar mobile antes" /></figure>
      <figure><figcaption>Depois</figcaption><img src="../../evidence/ui-04/refinos/depois-encontrar-mobile.png" alt="Encontrar mobile depois" /></figure>
    </div>
    <h2>5. Cabeçalho e rodapé</h2>
    <div class="pair">
      <figure><figcaption>Antes</figcaption><img src="../../evidence/ui-04/refinos/antes-chrome-desktop.png" alt="Chrome antes" /></figure>
      <figure><figcaption>Depois</figcaption><img src="../../evidence/ui-04/refinos/depois-chrome-desktop.png" alt="Chrome depois" /></figure>
    </div>
  </section>
</body>
</html>
